<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuadernos">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbf4ec">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Cuadernos</title>
<style>
  :root {
    --ink: #1f1d1a; --muted: #6f685f; --line: #e3ddd4; --canvas: #ebe7e0; --surface: #fff;
    --bar: #47663f; --bar-ink: #fff; --tint: #47663f; --tint-soft: rgba(71, 102, 63, .12); --danger: #c0392b;
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --pop-shadow: 0 2px 6px rgba(31, 29, 26, .08), 0 18px 40px -12px rgba(31, 29, 26, .28);
    font: 16px/1.35 var(--ui); color: var(--ink);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  ::selection { background: var(--tint-soft); }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; background: #f6f1ea url(fondo.webp) center / cover no-repeat; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; touch-action: manipulation; }
  button:disabled { opacity: .3; pointer-events: none; }
  :focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  .hidden { display: none !important; }
  .screen { position: fixed; inset: 0; }
  .icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; transition: background .15s; }
  .icon:active { background: rgba(31, 29, 26, .08); }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .primary { display: inline-flex; align-items: center; gap: 6px; background: var(--tint); color: #fff; font-weight: 600; border-radius: 10px; padding: 10px 16px; }
  .primary svg.i { width: 18px; height: 18px; stroke-width: 2.2; }
  .primary:active { filter: brightness(.9); }

  /* ---------- Estantería ---------- */
  #lib { overflow-y: auto; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .libhead { display: flex; align-items: center; gap: 12px; padding: 36px 40px 8px; }
  .libhead h1 { font: 700 34px/1.1 var(--ui); letter-spacing: -.02em; margin: 0; }
  .libhead img { width: 52px; }
  .libhead .acts { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  #shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 36px 28px; padding: 24px 40px 48px; }
  .book { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .cover { width: 100%; aspect-ratio: 1 / 1.414; border-radius: 3px 10px 10px 3px; transition: transform .2s var(--ease);
    box-shadow: inset 8px 0 8px -7px rgba(0, 0, 0, .28), 0 1px 2px rgba(0, 0, 0, .1), 0 10px 22px -10px rgba(31, 29, 26, .35); }
  .cover:active { transform: scale(.97); }
  .meta { display: flex; align-items: flex-start; gap: 4px; }
  .meta > div { flex: 1; min-width: 0; }
  .meta .name { font-size: 15px; font-weight: 600; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .meta .date { font-size: 13px; color: var(--muted); }
  .meta .icon { width: 32px; height: 32px; margin-top: -6px; color: var(--muted); }
  .hint { display: flex; align-items: center; gap: 12px; margin: 8px 40px 0; padding: 10px 10px 10px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 15px; }
  .hint span { flex: 1; }
  .hint button { color: var(--tint); font-weight: 600; padding: 6px 8px; }
  .empty { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 60px 0; text-align: center; }
  .empty img { width: 140px; }
  .empty p { margin: 0; font-size: 17px; font-weight: 600; }

  /* ---------- Cuaderno ---------- */
  #nb { background: var(--canvas); }
  #stage { position: absolute; inset: 0; touch-action: none; overflow: hidden; perspective: 2400px; }
  #sheet { position: absolute; inset: 0; transform-origin: 0 0; }
  #sheet canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 10; height: calc(52px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) calc(8px + env(safe-area-inset-right)) 0 calc(8px + env(safe-area-inset-left));
    display: flex; align-items: center; gap: 2px; background: var(--bar); color: var(--bar-ink); box-shadow: 0 1px 0 rgba(0, 0, 0, .08); }
  .topbar .icon:active { background: rgba(255, 255, 255, .18); }
  #back { width: auto; padding: 0 10px 0 4px; gap: 2px; display: flex; font-size: 17px; }
  .ttl { position: absolute; left: 50%; transform: translateX(-50%); max-width: 44%; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; pointer-events: none; }
  .ttl b { font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .ttl span { font-size: 14px; color: rgba(255, 255, 255, .78); font-variant-numeric: tabular-nums; }
  .topbar .sp { flex: 1; }
  .vsep { width: 1px; height: 24px; background: rgba(255, 255, 255, .25); margin: 0 6px; flex: none; }
  .nav { position: absolute; top: 50%; width: 36px; height: 64px; margin-top: -32px; z-index: 5; color: #8b8378; transition: opacity .2s; display: grid; place-items: center; }
  .nav svg.i { width: 26px; height: 26px; }
  #prev { left: 4px; } #next { right: 4px; }
  #nb.zoomed .nav { opacity: 0; pointer-events: none; }

  #dock { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10;
    display: flex; align-items: flex-end; height: 72px; padding: 0 6px 0 10px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(31, 29, 26, .06), 0 12px 28px -12px rgba(31, 29, 26, .3); transition: transform .4s var(--ease), opacity .3s; }
  #dock.away { transform: translate(-50%, 150%); opacity: 0; pointer-events: none; }
  .tools { display: flex; align-items: flex-end; height: 72px; overflow: hidden; gap: 4px; padding: 0 2px; }
  .tool { width: 38px; height: 72px; display: flex; justify-content: center; align-items: flex-end; }
  .tool svg, .tool img { transition: transform .3s var(--ease); }
  .tool svg { transform: translateY(26px); filter: drop-shadow(0 2px 2px rgba(31, 29, 26, .18)); }
  .tool.on svg { transform: translateY(8px); }
  .tool img { width: 38px; transform: translateY(-14px); }
  .tool.on img { transform: translateY(-22px) rotate(-6deg); }
  #dock .vsep { align-self: center; height: 32px; margin: 0 8px; background: var(--line); }
  #dock .icon { align-self: center; color: var(--muted); }
  .opt { width: 38px; height: 40px; display: grid; place-items: center; align-self: center; border-radius: 10px; }
  .opt .sw { width: 26px; height: 26px; }
  .opt.on .sw { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--ink); }
  .opt.custom { position: relative; cursor: pointer; }
  .opt.custom .sw { border: 3px solid transparent; background: conic-gradient(#e0262f, #ffa53d, #ffe94a, #16924a, #1f5fd6, #7b3fc4, #e0262f); }
  .palette { display: grid; grid-template-columns: repeat(10, 32px); gap: 8px; padding: 4px; }
  .opt.size.on { background: var(--tint-soft); }
  .stroke { display: block; width: 22px; border-radius: 99px; transform: rotate(-35deg); }
  .opt img { width: 30px; }
  #dockMini { position: absolute; right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%; z-index: 10;
    display: grid; place-items: center; overflow: hidden; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 10px 24px -10px rgba(31, 29, 26, .35); }

  .pop { position: fixed; z-index: 30; border-radius: 14px; padding: 14px; max-width: calc(100vw - 24px); max-height: 62vh; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--pop-shadow); animation: pop .18s var(--ease); }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } }
  .stack > * + * { margin-top: 14px; }
  .seg { display: inline-flex; background: #efebe5; border-radius: 9px; padding: 2px; }
  .seg button { padding: 6px 14px; border-radius: 7px; font-size: 14px; }
  .seg button.on { background: #fff; font-weight: 600; box-shadow: 0 1px 3px rgba(31, 29, 26, .14); }
  .grid { display: grid; grid-template-columns: repeat(6, 60px); gap: 4px; }
  .grid button { height: 60px; border-radius: 12px; display: grid; place-items: center; font-size: 30px; }
  .grid button.on, .grid button:active { background: var(--tint-soft); }
  .grid img { width: 50px; height: 50px; object-fit: contain; }
  .sw { width: 32px; height: 32px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); flex: none; }
  .sw.on { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--ink); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .menu { display: flex; flex-direction: column; min-width: 240px; margin: -8px; }
  .menu > * { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 9px; text-align: left; font-size: 16px; }
    .menu > button:active { background: rgba(31, 29, 26, .06); }
  .menu .grow { flex: 1; }
  .danger { color: var(--danger); }

  dialog { border: 0; border-radius: 14px; padding: 0; color: var(--ink); width: min(520px, 92vw); background: var(--surface); box-shadow: var(--pop-shadow); }
  dialog::backdrop { background: rgba(31, 29, 26, .32); }
  .dbar { display: flex; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .dbar b { flex: 1; text-align: center; font-size: 17px; font-weight: 600; }
  .dbar button { padding: 10px; font-size: 17px; color: var(--tint); min-width: 90px; }
  .dbar button:last-child { font-weight: 600; text-align: right; }
  .dbar button:first-child { text-align: left; }
  .dbody { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
  .dhead { display: flex; gap: 18px; align-items: center; }
  .dhead .cover { width: 76px; flex: none; }
  dialog input[type=text] { flex: 1; min-width: 0; font: 17px var(--ui); padding: 12px 14px; border: 0; border-radius: 10px; background: #f3efe9; color: var(--ink); outline: 0; -webkit-user-select: text; user-select: text; }
  dialog input[type=text]:focus { box-shadow: 0 0 0 2px var(--tint); }
  #bdDel { align-self: flex-start; font-size: 16px; padding: 4px 0; }
</style>
</head>
<body>

<section id="lib" class="screen">
  <header class="libhead">
    <h1>Cuadernos</h1>
    <img src="stickers/rana-estudia.webp" alt="">
    <div class="acts">
      <button class="icon" id="libMore" aria-label="Copias de seguridad"></button>
      <button class="primary" id="newBook"></button>
    </div>
  </header>
  <div id="hint" class="hint hidden"></div>
  <div id="shelf"></div>
  <input type="file" id="file" accept="application/json,.json" hidden>
</section>

<section id="nb" class="screen hidden">
  <div id="stage">
    <div id="sheet"><canvas id="bg"></canvas><canvas id="ink"></canvas><canvas id="live"></canvas></div>
  </div>
  <button class="nav" id="prev" aria-label="Hoja anterior"></button>
  <button class="nav" id="next" aria-label="Hoja siguiente"></button>
  <div class="topbar">
    <button class="icon" id="back" aria-label="Volver a los cuadernos"></button>
    <div class="ttl"><b id="nbTitle"></b><span id="pgNum"></span></div>
    <span class="sp"></span>
    <button class="icon" id="undo" aria-label="Deshacer"></button>
    <button class="icon" id="redo" aria-label="Rehacer"></button>
    <span class="vsep"></span>
    <button class="icon" id="pageSet" aria-label="Color y rayado de la hoja"></button>
    <button class="icon" id="addPage" aria-label="Añadir hoja"></button>
    <button class="icon" id="more" aria-label="Más opciones"></button>
  </div>
  <input type="file" id="imp" accept="application/pdf,image/*" multiple hidden>
  <div id="dock"></div>
  <button id="dockMini" class="hidden" aria-label="Mostrar el estuche"></button>
</section>

<div id="pop" class="pop hidden"></div>

<dialog id="bookDlg">
  <div class="dbar"><button type="button" id="bdCancel">Cancelar</button><b id="bdTitle"></b><button type="button" id="bdOk"></button></div>
  <div class="dbody">
    <div class="dhead">
      <div class="cover" id="bdPreview"></div>
      <input type="text" id="bdName" autofocus maxlength="60" placeholder="Nombre del cuaderno" aria-label="Nombre del cuaderno">
    </div>
    <div class="row" id="bdCover"></div>
    <button type="button" id="bdDel" class="danger">Borrar cuaderno</button>
  </div>
</dialog>

<script>
const W = 1000, H = 1414; // coordenadas de hoja, independientes de la pantalla y del zoom
const FLAG = ['#d52d00', '#ff9a56', '#ffffff', '#d162a4', '#a30262']; // bandera lésbica
const COVERS = [['Bandera','bandera'],['Vichy salvia','vichy:#8fa876'],['Vichy rosa','vichy:#d98fb5'],['Rosa','#d162a4'],
  ['Melocotón','#ff9a56'],['Salvia','#8fa876'],['Lavanda','#b7a3dc'],['Lino','#e8dcc4']];
const PAPERS = [['Blanco','#ffffff'],['Crema','#f8f1e2'],['Rosa','#fbe7ec'],['Salvia','#e6eedd'],['Lavanda','#eee8fa']];
const RULES = [['Lisa','lisa'],['Rayas','rayas'],['Cuadros','cuadros'],['Puntos','puntos']];
const PENS = {
  boli: [['Azul','#22388f'],['Negro','#1d1d1f'],['Rojo','#d0202e'],['Verde','#1f7a3d']],
  pluma: [['Azul','#1f4fd1'],['Negro','#151515'],['Sepia','#6b4a2f'],['Burdeos','#7a1f3d']],
  marca: [['Negro','#1d1d1f'],['Azul','#1f5fd6'],['Rojo','#e0262f'],['Verde','#16924a'],['Morado','#7b3fc4']],
  rotu: [['Amarillo','#ffe94a'],['Rosa','#ff7ac8'],['Verde','#8cf25a'],['Naranja','#ffa53d'],['Azul','#6cc6ff']],
};
// 10 tonos × 4 luces + grises, como la rejilla de colores del iPad
const PALETTE = [0, 25, 45, 60, 95, 145, 185, 210, 260, 310].flatMap(h => [[90, 78], [80, 62], [70, 48], [65, 34]].map(([sa, l]) => `hsl(${h}, ${sa}%, ${l}%)`))
  .reduce((rows, c, i) => (rows[i % 4].push(c), rows), [[], [], [], []]).flat()
  .concat(['#ffffff', '#d4d4d4', '#a3a3a3', '#737373', '#525252', '#3a3a3a', '#262626', '#1d1d1f', '#111111', '#000000']);
const TOOLS = { boli: 'Boli', pluma: 'Pluma', marca: 'Rotulador', rotu: 'Subrayador', goma: 'Goma', sticker: 'Stickers' };
const SIZES = { boli: [1.8, 2.8, 4.5], pluma: [4, 7, 11], marca: [3, 5, 8], rotu: [10, 16, 24], goma: [12, 24, 45], sticker: [12, 18, 26] };
const STICKERS = [...['rana','rana-flores','ranas-abrazo','rana-seta','rana-lectora','rana-te','rana-dormida','rana-estudia','rana-fresa',
  'corazon-lesbico','ramo','setas','mariposa','caracol','cesta','libros','carta','venus'].map(n => 'img:' + n), 'bandera', ...'✅ ❗ ❓ ⭐ 📌'.split(' ')];

const I = { // iconos de trazo fino
  back: '<path d="M15 5l-7 7 7 7"/>', load: '<path d="M12 3v12M8 11l4 4 4-4"/><path d="M5 12v6.5A2.5 2.5 0 007.5 21h9a2.5 2.5 0 002.5-2.5V12"/>', next: '<path d="M9 5l7 7-7 7"/>',
  undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/>', redo: '<path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/>',
  page: '<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h3.5"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  more: '<circle cx="5.5" cy="12" r=".9"/><circle cx="12" cy="12" r=".9"/><circle cx="18.5" cy="12" r=".9"/>',
  share: '<path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v6.5A2.5 2.5 0 007.5 21h9a2.5 2.5 0 002.5-2.5V12"/>',
  trash: '<path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>', down: '<path d="M6 9l6 6 6-6"/>',
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

const $ = s => document.querySelector(s);
const uid = () => crypto.randomUUID();
const el = (tag, cls = '', html = '') => { const e = document.createElement(tag); e.className = cls; e.innerHTML = html; return e; };

// Preferencias: comodidad, no datos. Si localStorage falla, se usan las de serie.
let state = { tool: 'boli', sticker: 'img:rana', min: false,
  colors: { boli: '#22388f', pluma: '#1f4fd1', marca: '#1d1d1f', rotu: '#ffe94a' }, custom: {},
  size: { boli: 2.8, pluma: 7, marca: 5, rotu: 16, goma: 24, sticker: 18 } };
try { const s = JSON.parse(localStorage.getItem('prefs4')); if (s) state = { ...state, ...s, colors: { ...state.colors, ...s.colors }, custom: { ...s.custom }, size: { ...state.size, ...s.size } }; } catch {}
const persist = () => { try { localStorage.setItem('prefs4', JSON.stringify(state)); } catch {} };
const ink = () => state.colors[state.tool];

/* ---------- Almacenamiento (IndexedDB) ---------- */
const dbp = new Promise((ok, ko) => {
  const r = indexedDB.open('cuadernos', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('books', { keyPath: 'id' }); r.result.createObjectStore('pages', { keyPath: 'id' }); };
  r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
});
async function idb(store, mode, fn) {
  const db = await dbp;
  return new Promise((ok, ko) => { const t = db.transaction(store, mode); const q = fn(t.objectStore(store)); t.oncomplete = () => ok(q.result); t.onerror = () => ko(t.error); });
}
const get = (s, id) => idb(s, 'readonly', o => o.get(id));
const getAll = s => idb(s, 'readonly', o => o.getAll());
const put = (s, v) => idb(s, 'readwrite', o => o.put(v));
const del = (s, id) => idb(s, 'readwrite', o => o.delete(id));
navigator.storage?.persist?.();

/* ---------- Sonido ---------- */
let ac; const bufs = {};
function audio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      for (const n of ['pasar-hoja']) fetch(`sonidos/${n}.wav`).then(r => r.arrayBuffer()).then(b => ac.decodeAudioData(b)).then(d => bufs[n] = d).catch(() => {});
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  } catch { return null; }
}
document.addEventListener('pointerdown', () => audio(), { once: true }); // iOS solo deja arrancar el audio tras un toque
function flipSound() {
  const a = audio(); if (!a || !bufs['pasar-hoja']) return;
  const s = a.createBufferSource(), g = a.createGain();
  s.buffer = bufs['pasar-hoja']; s.playbackRate.value = .94 + Math.random() * .12; g.gain.value = .85;
  s.connect(g).connect(a.destination); s.start();
}

/* ---------- Dibujo ---------- */
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
const lum = c => { if (c[0] !== '#') return 1; const n = parseInt(c.slice(1), 16); return (.299 * (n >> 16) + .587 * (n >> 8 & 255) + .114 * (n & 255)) / 255; };

const IMG = {};
function stickerImg(name) {
  if (!IMG[name]) { const i = new Image(); i.src = `stickers/${name}.webp`; i.onload = () => { if (page) renderInk(); }; IMG[name] = i; }
  return IMG[name];
}
const PIC = new Map(); // fotos pegadas: la clave es su dataURL
function picImg(src) {
  if (!PIC.has(src)) { const i = new Image(); i.onload = () => { if (page) renderInk(); }; i.src = src; PIC.set(src, i); }
  return PIC.get(src);
}
STICKERS.filter(s => s.startsWith('img:')).forEach(s => stickerImg(s.slice(4)));

function coverCss(v) {
  if (v === 'bandera') return `linear-gradient(${FLAG.map((c, i) => `${c} ${i * 20}% ${(i + 1) * 20}%`).join(',')})`;
  if (v.startsWith('vichy:')) { const c = v.slice(6) + '73'; return `linear-gradient(90deg, ${c} 50%, transparent 50%) 0 0 / 18px 18px, linear-gradient(${c} 50%, transparent 50%) 0 0 / 18px 18px, #fffaf2`; }
  return v;
}
function fillCover(ctx, v) {
  if (v === 'bandera') { FLAG.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, i * H / 5, W, H / 5 + 1); }); return; }
  if (v.startsWith('vichy:')) {
    ctx.fillStyle = '#fffaf2'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = v.slice(6); ctx.globalAlpha = .45;
    for (let x = 0; x < W; x += 112) ctx.fillRect(x, 0, 56, H);
    for (let y = 0; y < H; y += 112) ctx.fillRect(0, y, W, 56);
    ctx.globalAlpha = 1; return;
  }
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
const BG = new Map();
function bgImg(pg) {
  let i = BG.get(pg.id);

/* ---------- Cuaderno abierto ---------- */

  const pgs = [...dirty]; dirty.clear();
  book.updated = Date.now(); book.last = idx;
  try { for (const p of pgs) await put('pages', p); await put('books', book); }
  catch { alert('No se ha podido guardar. Vuelve a los cuadernos y pulsa «Guardar copia».'); }
}

async function loadPage() {
  const id = book.pages[idx];
  page = cache.get(id) || await get('pages', id);
  cache.set(id, page);
  $('#pgNum').textContent = idx === 0 ? 'Portada' : `${idx} / ${book.pages.length - 1}`;
  $('#prev').style.visibility = idx > 0 ? 'visible' : 'hidden';
  $('#next').style.visibility = idx < book.pages.length - 1 ? 'visible' : 'hidden';
}

let turning = false;
async function turn(d) {
  const ni = idx + d;
  if (turning || ni < 0 || ni >= book.pages.length) return;
  turning = true; closePop();
  if (zoomed()) { V = { ...FIT }; renderAll(); }
  flipSound();
  sheet.style.transformOrigin = `${V.ox}px 50%`;
  try {
    if (d > 0) { // la hoja se levanta hacia el lomo y aparece la siguiente
      const a = sheet.animate([{ transform: 'rotateY(0)' }, { transform: 'rotateY(-86deg)', opacity: .6 }], { duration: 300, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' });
      await a.finished; idx = ni; await loadPage(); renderAll(); a.cancel();
    } else {
      idx = ni; await loadPage(); renderAll();
      await sheet.animate([{ transform: 'rotateY(-86deg)', opacity: .6 }, { transform: 'rotateY(0)' }], { duration: 300, easing: 'cubic-bezier(.4,0,.2,1)' }).finished;

// Cada útil dibujado con su tinta. viewBox vertical, punta arriba.
function penSvg(tool, c, ht) {
  const body = {
    boli: `<path d="M8.2 1 L11.8 1 L14 9 L6 9 Z" fill="#dcd6cd"/><circle cx="10" cy="1.4" r="1.3" fill="${c}"/>
      <rect x="5" y="9" width="10" height="50" rx="1.5" fill="rgba(255,255,255,.8)" stroke="rgba(40,30,30,.18)"/>
      <path d="M8 9.5v49M12 9.5v49" stroke="rgba(40,30,30,.07)"/><rect x="8.5" y="10" width="3" height="48" fill="${c}"/>
      <rect x="4.5" y="56" width="11" height="15.5" rx="2.5" fill="${c}"/><rect x="12.6" y="42" width="2.6" height="20" rx="1.3" fill="${c}"/>`,
    pluma: `<path d="M10 0 L15 13 L5 13 Z" fill="#d9b66c"/><path d="M10 3v7" stroke="#7d5f25" stroke-width=".8"/><circle cx="10" cy="9.5" r="1" fill="#7d5f25"/>
      <rect x="4.5" y="13" width="11" height="58.5" rx="5" fill="${c}"/><rect x="4.5" y="37" width="11" height="3" fill="#d9b66c"/>
      <rect x="6.5" y="16" width="2" height="50" rx="1" fill="rgba(255,255,255,.3)"/>`,
    rotu: `<path d="M6 9 L14 3 L14 10 L6 10 Z" fill="${c}"/><rect x="3" y="10" width="14" height="61.5" rx="3.5" fill="${c}"/>
      <rect x="3" y="30" width="14" height="22" fill="rgba(255,255,255,.5)"/><rect x="5" y="13" width="2.5" height="55" rx="1.2" fill="rgba(255,255,255,.35)"/>`,
    marca: `<path d="M8.5 0 L11.5 0 L13 8 L7 8 Z" fill="${c}"/><path d="M6 8 L14 8 L15 14 L5 14 Z" fill="#d9d4cc"/>
      <rect x="4.5" y="14" width="11" height="57.5" rx="2.5" fill="${c}"/><rect x="4.5" y="28" width="11" height="16" fill="rgba(255,255,255,.75)"/>
      <rect x="6.5" y="16" width="2" height="52" rx="1" fill="rgba(255,255,255,.3)"/>`,
    goma: `<rect x="3" y="12" width="14" height="46" rx="3" fill="#f4b3c3"/><rect x="3" y="36" width="14" height="22" rx="3" fill="#9db9e8"/><rect x="3" y="34" width="14" height="4" fill="#9db9e8"/>
      <rect x="5" y="14" width="2.5" height="42" rx="1.2" fill="rgba(255,255,255,.4)"/>`,
  }[tool];
  return `<svg viewBox="0 0 20 72" width="${Math.round(ht * 20 / 72)}" height="${ht}" aria-hidden="true">${body}</svg>`;
}
// El estuche lleva a la vista todo lo que se toca: útil, color y grosor. Solo los stickers abren una ventanita.
function buildDock() {
  const dock = $('#dock'); dock.innerHTML = '';
  dock.classList.toggle('away', !!state.min); $('#dockMini').classList.toggle('hidden', !state.min);
  const mini = $('#dockMini'); mini.innerHTML = '';
  if (state.tool === 'sticker') mini.append(stickerIcon(state.sticker, 40));
  else mini.innerHTML = penSvg(state.tool, ink() || '', 64).replace('<svg', '<svg style="transform:translateY(16px)"');
  const tools = el('div', 'tools');
  for (const [t, name] of Object.entries(TOOLS)) {
    const b = el('button', 'tool' + (state.tool === t ? ' on' : ''));
    b.setAttribute('aria-label', name); b.title = name;
    if (t === 'sticker') b.append(stickerIcon(t === state.tool ? state.sticker : 'img:rana', 40));
    else b.innerHTML = penSvg(t, state.colors[t] || '', 72);
    b.onclick = () => {
      if (t === 'sticker') { state.tool = t; persist(); buildDock(); return stickerPop($('#dock .tool.on')); }
      state.tool = t; persist(); buildDock(); closePop();
    };
    tools.append(b);
  }
  dock.append(tools, el('span', 'vsep'));
  const t = state.tool;
  for (const [name, c] of PENS[t] || []) {
    const b = el('button', 'opt' + (ink() === c ? ' on' : ''), '<span class="sw"></span>');
    b.firstChild.style.background = c; b.setAttribute('aria-label', name);
    b.onclick = () => { state.colors[t] = c; persist(); buildDock(); };
    dock.append(b);
  }
  const RAINBOW = 'conic-gradient(#e0262f, #ffa53d, #ffe94a, #16924a, #1f5fd6, #7b3fc4, #e0262f)';
  if (PENS[t]) { // otro color: paleta propia (el selector del iPad se cierra al primer toque)
    const own = state.custom[t], b = el('button', 'opt custom' + (own && ink() === own ? ' on' : ''), '<span class="sw"></span>');
    const paint = c => b.firstChild.style.background = `linear-gradient(${c}, ${c}) padding-box, ${RAINBOW} border-box`;
    if (own) paint(own);
    b.setAttribute('aria-label', 'Otro color'); b.title = 'Otro color';
    b.onclick = () => {
      if (own && ink() !== own) { state.colors[t] = own; persist(); return buildDock(); } // primer toque: vuelve a su color
      const box = swatches(PALETTE.map(c => [c, c]), ink(), c => { // la ventanita sigue abierta: se ve el color en el estuche
        state.custom[t] = state.colors[t] = c; persist(); paint(c);
        dock.querySelectorAll('.opt:not(.size)').forEach(o => o.classList.toggle('on', o === b));
        dock.querySelectorAll('.stroke').forEach(x => x.style.background = c);
        dock.querySelector('.tool.on').innerHTML = penSvg(t, c, 72);
      }, c => c);
      box.className = 'palette'; openPop(b, box);
    };
    dock.append(b, el('span', 'vsep'));
  }
  SIZES[t].forEach((v, i) => {
    const b = el('button', 'opt size' + (state.size[t] === v ? ' on' : ''));
    b.setAttribute('aria-label', ['Fino', 'Medio', 'Grueso'][i]);
    if (t === 'sticker') b.append(stickerIcon(state.sticker, 16 + i * 8));
    else if (t === 'goma') { const px = 8 + i * 6; b.innerHTML = `<span style="width:${px}px;height:${px}px;border-radius:50%;border:1.5px solid var(--muted)"></span>`; }
    else b.innerHTML = `<span class="stroke" style="height:${[2, 4, 7][i]}px;background:${ink()}"></span>`;
    b.onclick = () => { state.size[t] = v; persist(); buildDock(); };
    dock.append(b);
  });
  const hide = el('button', 'icon', icon('down')); hide.setAttribute('aria-label', 'Ocultar el estuche');
  hide.onclick = () => setMin(true);
  dock.append(el('span', 'vsep'), hide);
}

let popAnchor = null;
function openPop(anchor, content, below) {
  const p = $('#pop'); p.innerHTML = ''; p.append(content); p.classList.remove('hidden');
  popAnchor = anchor;
  const a = anchor.getBoundingClientRect(), w = p.offsetWidth, hgt = p.offsetHeight;
  const left = Math.max(12, Math.min(innerWidth - w - 12, a.left + a.width / 2 - w / 2));
  p.style.left = left + 'px';
  p.style.top = (below ? a.bottom + 12 : Math.max(12, a.top - hgt - 14)) + 'px';

}
function closePop() { $('#pop').classList.add('hidden'); popAnchor = null; }
document.addEventListener('pointerdown', e => {

function seg(list, curVal, pick) {

    const b = el('button', val === curVal ? 'on' : '', label); b.type = 'button';
    b.onclick = () => { pick(val); s.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
    s.append(b);

}
function swatches(list, curVal, pick, css) {

    const b = el('button', 'sw' + (val === curVal ? ' on' : '')); b.type = 'button';
    b.style.background = css(val); b.title = label; b.setAttribute('aria-label', label);
    b.onclick = () => { pick(val); box.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); };

/* ---------- Importar ----------
   Cada página de un PDF (p. ej. una nota exportada desde Notas) pasa a ser una hoja nueva tras la actual; las fotos van sueltas en la hoja. */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsP;
const loadPdfjs = () => pdfjsP ??= new Promise((ok, ko) => {
  const s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js';
  s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; ok(pdfjsLib); };
  s.onerror = () => { pdfjsP = null; ko(); }; document.head.append(s);
});
const IMPW = 1400; // ancho de la imagen guardada: nítida con zoom sin llenar el iPad
function toJpeg(src, w, h) { // src: algo que se pueda dibujar en un canvas
  const c = document.createElement('canvas'), f = Math.min(1, IMPW / w);
  c.width = Math.round(w * f); c.height = Math.round(h * f);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .85);
}
// Foto suelta encima de la hoja actual, en el centro de lo que se ve: se mueve con un dedo y se agranda pellizcando.
async function addPic(blob, n = 0) {
  if (!page || page.cover) return alert('Las fotos se pegan en una hoja, no en la portada.');
  const im = new Image(), url = URL.createObjectURL(blob);
  try { await new Promise((ok, ko) => { im.onload = ok; im.onerror = ko; im.src = url; }); } catch { return alert('No se ha podido abrir esa imagen.'); } finally { URL.revokeObjectURL(url); }
  const a = im.naturalWidth / im.naturalHeight, f = Math.min(1, 1000 / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * f); c.height = Math.round(im.naturalHeight * f);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
  const it = { t: 's', e: 'foto', src: c.toDataURL('image/jpeg', .85), a: +a.toFixed(4), s: Math.round(W * .55),
    x: +((vw / 2 - V.ox) / V.S + n * 30).toFixed(1), y: +((vh / 2 - V.oy) / V.S + n * 30).toFixed(1), r: 0 };
  pushHist(page.items); page.items = [...page.items, it]; renderInk(); savePage();
}
async function pasteImage() {
  try {
    for (const item of await navigator.clipboard.read()) {
      const type = item.types.find(t => t.startsWith('image/'));
      if (type) return addPic(await item.getType(type));
    }
    alert('No hay ninguna imagen copiada.');
  } catch { alert('No se ha podido pegar. Copia la imagen otra vez y prueba de nuevo.'); }
}
document.addEventListener('paste', e => { // con teclado: Cmd+V
  if (!book) return;
  const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
  if (f) { e.preventDefault(); addPic(f); }
});
async function importFiles(files) {
  const imgs = [], status = $('#pgNum');
  try {
    for (const f of files) {
      if (f.type === 'application/pdf') {
        const lib = await loadPdfjs(), doc = await lib.getDocument({ data: await f.arrayBuffer() }).promise;
        for (let n = 1; n <= doc.numPages; n++) {
          status.textContent = `Importando ${imgs.length + 1}…`;
          const pg = await doc.getPage(n), vp = pg.getViewport({ scale: IMPW / pg.getViewport({ scale: 1 }).width });
          const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
          await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
          imgs.push(toJpeg(c, c.width, c.height)); c.width = c.height = 0;
        }
      } else if (f.type.startsWith('image/')) await addPic(f, files.indexOf(f)); // las fotos van sueltas en la hoja
    }
  } catch { alert(pdfjsP ? 'No se ha podido abrir ese archivo.' : 'Para importar un PDF hace falta conexión a internet la primera vez.'); }
  if (!imgs.length) return loadPage();
  const pages = imgs.map(img => ({ id: uid(), color: '#ffffff', rule: 'lisa', img, items: [] }));
  book.pages.splice(idx + 1, 0, ...pages.map(p => p.id));
  for (const p of pages) { cache.set(p.id, p); dirty.add(p); }
  await flush(); await loadPage(); turn(1);
}
$('#imp').onchange = e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) importFiles(fs); };

async function addPage() {
  const ref = page.cover ? null : page;
  const np = { id: uid(), color: ref ? ref.color : book.paper, rule: ref ? ref.rule : book.rule, items: [] };
  book.pages.splice(idx + 1, 0, np.id);
  cache.set(np.id, np); dirty.add(np);
  await flush(); await loadPage(); turn(1);
}
async function delPage() {
  if (idx === 0 || book.pages.length <= 2 || !confirm('¿Borrar esta hoja? No se puede deshacer.')) return;
  const id = book.pages[idx];
  book.pages.splice(idx, 1); dirty.delete(page); cache.delete(id);
  await del('pages', id);
  idx = Math.min(idx, book.pages.length - 1);
  await flush(); await loadPage(); renderAll();
}
// Devuelve false solo si la persona cancela el menú de compartir.
async function shareOrDownload(blob, name) {
  const f = new File([blob], name, { type: blob.type });
  if (navigator.canShare?.({ files: [f] })) {
    try { await navigator.share({ files: [f] }); return true; }
    catch (e) { if (e.name === 'AbortError') return false; } // otro error (p. ej. sin permiso): se descarga
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  return true;
}
// Copia de seguridad: el aviso de la estantería recuerda hacerla si hace más de una semana.
const lastBackup = () => { try { return +localStorage.getItem('lastBackup') || 0; } catch { return 0; } };
async function backup() {

  const ok = await shareOrDownload(new Blob([JSON.stringify(data)], { type: 'application/json' }), `cuadernos-${new Date().toISOString().slice(0, 10)}.json`);

}
function showHint() {
  const h = $('#hint'), t = lastBackup(), days = Math.floor((Date.now() - t) / 864e5);

  h.classList.toggle('hidden', !due);

  h.innerHTML = `<span>${t ? `Última copia: hace ${days} días` : 'Aún no has guardado ninguna copia'}</span>`;

}

$('#file').onchange = async e => {
  try {
    const d = JSON.parse(await e.target.files[0].text());
    if (!Array.isArray(d.books) || !Array.isArray(d.pages)) throw 0;
    const have = new Set(books.map(b => b.id));
    const nb = d.books.filter(b => b.id && Array.isArray(b.pages) && !have.has(b.id));
    const ids = new Set(nb.flatMap(b => b.pages));
    for (const p of d.pages) if (ids.has(p.id)) await put('pages', p);
    for (const b of nb) await put('books', b);
    alert(nb.length ? `${nb.length} cuadernos recuperados.` : 'Esos cuadernos ya estaban aquí.');
    showLibrary();
  } catch { alert('Ese archivo no es una copia de Cuadernos.'); }
  e.target.value = '';
};

addEventListener('resize', () => { if (book) { closePop(); fit(); } });
addEventListener('keydown', e => {
  if (!book || document.querySelector('dialog[open]')) return;
  if (e.key === 'ArrowRight') turn(1);
  if (e.key === 'ArrowLeft') turn(-1);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
});

if ('serviceWorker' in navigator) {
  const had = !!navigator.serviceWorker.controller; // al llegar una versión nueva, recargar una vez para estrenarla
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) location.reload(); });
  navigator.serviceWorker.register('sw.js').then(r => r.update());
}
showLibrary();
</script>
</body>
